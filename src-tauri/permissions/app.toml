[[permission]]
identifier = "secure-plugin-host-approval-commands"
description = "Allows only the protected plugin Host approval window to read and decide its bound request."
commands.allow = [
  "plugin_host_approval_get",
  "plugin_host_approval_decide",
]

[[permission]]
identifier = "secure-plugin-remote-approval-commands"
description = "Allows only the protected remote operation window to read and decide its exact prompt."
commands.allow = ["plugin_remote_approval_get", "plugin_remote_approval_decide", "plugin_credential_input_submit"]

[[permission]]
identifier = "secure-plugin-special-permission-commands"
description = "Allows only the protected plugin permission window to read and decide its bound request."
commands.allow = [
  "plugin_special_permission_get",
  "plugin_special_permission_decide",
]

[[permission]]
identifier = "plugin-isolated-surface-commands"
description = "Allows a nonce-bound trusted wrapper to broker only its assigned isolated surface."
commands.allow = [
  "plugin_isolated_surface_content",
  "plugin_isolated_bridge",
]

[[permission]]
identifier = "secure-plugin-terminal-input-commands"
description = "Allows only the protected terminal input approval window to read and decide its bound request."
commands.allow = [
  "plugin_terminal_input_get",
  "plugin_terminal_input_decide",
]

[[permission]]
identifier = "secure-ssh-sync-commands"
description = "Allows only a protected SSH sync data-exchange window to read and decide its bound request."
commands.allow = [
  "ssh_sync_secure_prompt_get",
  "ssh_sync_secure_prompt_decide",
]

[[permission]]
identifier = "desktop-secure-commands"
description = "Allows only desktop authentication prompts to get and answer their own challenge."
commands.allow = ["desktop_prompt_get", "desktop_prompt_decide"]

[[permission]]
identifier = "tray-panel-commands"
description = "Only the restricted tray panel projection and one-shot actions."
commands.allow = ["tray_panel_snapshot", "tray_panel_execute", "tray_panel_hide"]
