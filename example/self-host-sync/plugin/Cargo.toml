[package]
name = "norishell-self-host-sync"
version = "0.1.12"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
norishell-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde_json = "1.0.149"
url = "2.5.8"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
