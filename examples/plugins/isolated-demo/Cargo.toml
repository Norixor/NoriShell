[package]
name = "norishell-isolated-demo"
version = "1.0.2"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
norishell-plugin-sdk = { path = "../../../crates/plugin-sdk" }
