[package]
name = "norishell-app-demo"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
norishell-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde_json = "1.0.149"
base64 = "0.22.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
