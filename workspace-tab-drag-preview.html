<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoriShell</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      html { opacity: .86; transition: opacity 120ms ease-out; }
      html.fade { opacity: 0; }
      .outline {
        box-sizing: border-box;
        height: 108px;
        margin: 3px;
        border: 1px solid rgba(255,255,255,.4);
        border-radius: 10px;
        background: rgba(38, 45, 57, .84);
        box-shadow: 0 6px 22px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.09);
        animation: arrive 140ms ease-out both;
      }
      @keyframes arrive { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .header { height: 28px; display: flex; align-items: end; border-bottom: 1px solid rgba(218,232,255,.2); }
      .tab { width: 74px; height: 21px; margin-left: 10px; border-radius: 5px 5px 0 0; background: rgba(218,232,255,.22); }
      .page { height: 62px; margin: 8px; border-radius: 5px; background: rgba(218,232,255,.07); padding: 10px; }
      .line { width: 66%; height: 5px; border-radius: 99px; background: rgba(218,232,255,.46); }
      .line + .line { width: 43%; margin-top: 10px; opacity: .55; }
      @media (prefers-color-scheme: light) {
        .outline { background: rgba(240,244,250,.86); border-color: rgba(68,88,113,.24); box-shadow: 0 6px 22px rgba(34,49,68,.18); }
        .header { border-color: rgba(65,89,125,.2); }
        .tab { background: rgba(65,89,125,.16); }
        .page { background: rgba(65,89,125,.08); }
        .line { background: rgba(65,89,125,.4); }
      }
    </style>
  </head>
  <body><div class="outline" aria-hidden="true"><div class="header"><div class="tab"></div></div><div class="page"><div class="line"></div><div class="line"></div></div></div></body>
</html>
