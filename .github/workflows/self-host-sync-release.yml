name: Verify NoriShell Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release tag
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Install updater signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
      - name: Download and verify the complete Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          app_version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          sync_version=$(python3 -c 'import json; print(json.load(open("example/self-host-sync/plugin/manifest.json"))["version"])')
          test "$RELEASE_TAG" = "v$app_version"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          python3 tools/verify_release_assets.py --assets release-assets --version "$app_version" --sync-version "$sync_version"
