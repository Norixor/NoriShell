<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="824" viewBox="0 0 1160 824" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How NoriShell works</title><desc id="desc">The user interacts through the desktop interface or separate protected windows. Rust Core owns connections and sessions, checks identity and authentication, and manages input and resource lifecycle. Isolated WebAssembly plugins request approved capabilities through the Core permission broker and cannot directly access the Vault. Core connects remote sessions and the local shell. Local SQLite stores non-secret settings; the encrypted Vault stores saved secrets and is not uploaded by sync.</desc>
