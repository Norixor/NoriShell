<title id="title">NoriShell Core and security boundaries</title><desc id="desc">Architecture overview of NoriShell. Inside one desktop app process, the interface layer (a Vue main window, one native view per tab that can move between windows, and separate secure windows for Vault, credential and approval prompts) talks to the Rust Core through typed commands and receives projections back. The Rust Core owns SSH: the host key must be confirmed on first use and a changed key blocks the connection; routes may use Direct, HTTP CONNECT or SOCKS5 plus jump hosts. It owns sessions: one input owner per pane, and Terminal, SFTP and Forward each use their own transport. It owns the Vault: Argon2id derives the key, XChaCha20-Poly1305 encrypts, and secrets stay in Core memory. Plugins run as WebAssembly in a separate process with capabilities denied by default and can only call the Core broker; they have no access to the Vault, database or sockets. The Core reaches external targets (SSH, SFTP and port forwarding; RDP and VNC; the local shell) and local storage (an encrypted Vault file and a non-secret SQLite database).</desc>
