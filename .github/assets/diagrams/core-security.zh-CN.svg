<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">NoriShell Core 与安全边界</title><desc id="desc">NoriShell 架构概览。在同一个桌面应用进程内，界面层（Vue 主窗口、每个标签页一个可在窗口间移动的原生视图，以及用于 Vault、凭据和审批提示的独立安全窗口）通过类型化命令与 Rust Core 通信并接收投影。Rust Core 独占 SSH：host key 首次使用需明确确认，指纹变化则阻断连接；连接路径可用 Direct、HTTP CONNECT 或 SOCKS5 并叠加跳板。Core 独占会话：每个 Pane 只有一个输入所有者，Terminal、SFTP 与转发各自使用独立 transport。Core 独占 Vault：Argon2id 派生密钥、XChaCha20-Poly1305 加密，秘密只留在 Core 内存。插件以 WebAssembly 在独立进程运行，能力默认拒绝，只能调用 Core broker，不能访问 Vault、数据库或 socket。Core 连接外部目标（SSH、SFTP 与端口转发；RDP 与 VNC；本机 Shell）并管理本地存储（加密 Vault 文件与非秘密 SQLite 数据库）。</desc>
