<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="824" viewBox="0 0 1160 824" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">NoriShell 如何工作</title><desc id="desc">用户通过桌面界面发起操作，并在独立受保护窗口中输入凭据和批准安全操作。Rust Core 管理连接与会话、身份核验与认证、输入控制与资源生命周期。WebAssembly 插件在独立进程中运行，只能通过 Core 权限入口请求已授权能力，不能直接访问 Vault。Core 连接远程会话和本机 Shell。本地数据库保存非秘密设置，加密 Vault 保存秘密；同步不上传 Vault 文件。</desc>
<defs><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174fae"/><stop offset="1" stop-color="#12386f"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 5 3-5 3" fill="none" stroke="#8193af" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
